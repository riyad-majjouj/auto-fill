name: Build Auto-Filler Pro with Nuitka

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # تم التحديث إلى v4

      - name: Set up Python
        uses: actions/setup-python@v5 # تم التحديث إلى v5
        with:
          python-version: '3.10' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install zstandard 

      - name: Install Playwright Browsers (Dummy)
        run: |
          playwright install chromium

      - name: Build EXE with Nuitka
        run: |
          python -m nuitka --standalone --onefile --windows-disable-console --enable-plugin=tk-inter --enable-plugin=custom-tkinter --include-package=playwright --include-package=google.generativeai --include-package=keyboard app.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4 # تم التحديث إلى v4
        with:
          name: AutoFillerPro-Executable
          path: app.exe
